name: Ghidra DLL Decompilation

on:
  workflow_dispatch:
  push:
    paths:
      - "samp.dll"
      - "scripts/ExportAll.java"
      - "README.md"
      - ".github/workflows/ghidra-decompile.yml"

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y unzip jq

      - name: Download Ghidra
        shell: bash
        run: |
          set -euo pipefail
          URL="$(curl -fsSL https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest | jq -r '[.assets[] | select(.name | test("^ghidra_.*_PUBLIC_.*\\.zip$"))][0].browser_download_url')"
          test -n "$URL" && test "$URL" != "null"
          curl -fL "$URL" -o "$RUNNER_TEMP/ghidra.zip"
          mkdir -p "$RUNNER_TEMP/ghidra"
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          echo "GHIDRA_HOME=$(find "$RUNNER_TEMP/ghidra" -mindepth 1 -maxdepth 1 -type d | head -n 1)" >> "$GITHUB_ENV"

      - name: Decompile samp.dll
        run: |
          mkdir -p reverse
          "$GHIDRA_HOME/support/analyzeHeadless" "$RUNNER_TEMP/ghidra-project" PSAMP \
            -import "$GITHUB_WORKSPACE/samp.dll" \
            -scriptPath "$GITHUB_WORKSPACE/scripts" \
            -postScript ExportAll.java "$GITHUB_WORKSPACE/reverse/samp_decompiled.c" \
            -deleteProject

      - name: Commit generated C output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reverse/samp_decompiled.c
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Ghidra decompilation of samp.dll"
            git push origin HEAD:main
          fi
