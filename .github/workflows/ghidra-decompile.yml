name: Ghidra DLL Decompilation

on:
  workflow_dispatch:
  push:
    paths:
      - "samp.dll"
      - "scripts/ExportAll.java"
      - "README.md"
      - ".github/workflows/ghidra-decompile.yml"

permissions:
  contents: write

concurrency:
  group: ghidra-decompile-main
  cancel-in-progress: false

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip jq curl

      - name: Download Ghidra
        shell: bash
        run: |
          set -euo pipefail
          RELEASE="$(curl -fsSL https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest)"
          URL="$(printf '%s' "$RELEASE" | jq -r '[.assets[] | select(.name | test("^ghidra_.*_PUBLIC_.*\\.zip$"))][0].browser_download_url // empty')"
          if [[ -z "$URL" ]]; then
            echo "Could not find the public Ghidra ZIP in the latest release."
            printf '%s' "$RELEASE" | jq -r '.assets[].name'
            exit 1
          fi
          curl --retry 5 --retry-all-errors --retry-delay 3 -fL "$URL" -o "$RUNNER_TEMP/ghidra.zip"
          mkdir -p "$RUNNER_TEMP/ghidra"
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          GHIDRA_HOME="$(find "$RUNNER_TEMP/ghidra" -mindepth 1 -maxdepth 1 -type d -name 'ghidra_*' | head -n 1)"
          test -n "$GHIDRA_HOME"
          test -x "$GHIDRA_HOME/support/analyzeHeadless"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"
          "$GHIDRA_HOME/support/analyzeHeadless" -version || true

      - name: Prepare analysis directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ghidra-project"
          mkdir -p "$GITHUB_WORKSPACE/reverse"
          test -d "$RUNNER_TEMP/ghidra-project"
          test -d "$GITHUB_WORKSPACE/reverse"
          test -s "$GITHUB_WORKSPACE/samp.dll"

      - name: Decompile samp.dll
        shell: bash
        run: |
          set -euo pipefail
          "$GHIDRA_HOME/support/analyzeHeadless" \
            "$RUNNER_TEMP/ghidra-project" \
            PSAMP \
            -import "$GITHUB_WORKSPACE/samp.dll" \
            -overwrite \
            -analysisTimeoutPerFile 7200 \
            -scriptPath "$GITHUB_WORKSPACE/scripts" \
            -postScript ExportAll.java "$GITHUB_WORKSPACE/reverse/samp_decompiled.c" \
            -deleteProject
          test -s "$GITHUB_WORKSPACE/reverse/samp_decompiled.c"
          echo "Generated output:"
          wc -lc "$GITHUB_WORKSPACE/reverse/samp_decompiled.c"
          head -n 20 "$GITHUB_WORKSPACE/reverse/samp_decompiled.c"

      - name: Upload decompilation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samp-ghidra-decompilation
          path: reverse/samp_decompiled.c
          if-no-files-found: warn
          retention-days: 14

      - name: Commit generated C output
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reverse/samp_decompiled.c
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Ghidra decompilation of samp.dll"
            git push origin HEAD:main
          fi
